name: Build and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 2026.07.26.18
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            app-frontend/package-lock.json

      - name: Validate backend
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q main.py app schemas.py
          python -m unittest discover -s tests -v

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # The App ships from app-frontend into app-frontend-dist, which is
      # gitignored, so CI has to build it -- there is no committed artefact to
      # fall back on. `npm run build` runs vue-tsc first, so a type error fails
      # the release here rather than on the host.
      - name: Build app frontend
        working-directory: app-frontend
        run: |
          npm ci
          npm run build

      # deploy_remote.sh greps each dist for its own version, and /health/ready
      # reports the App as a separate check that must be ok. Neither build emits
      # version.json, so both are stamped here.
      - name: Stamp release
        run: |
          cat > frontend/dist/version.json <<EOF
          {"version":"${{ inputs.version }}","released_at":"$(date -Iseconds)","source":"${GITHUB_SHA}"}
          EOF
          cat > app-frontend-dist/version.json <<EOF
          {"version":"${{ inputs.version }}","released_at":"$(date -Iseconds)","source":"${GITHUB_SHA}"}
          EOF

      - name: Package release
        run: |
          tar -czf backend.tar.gz main.py schemas.py database.py models.py requirements.txt app alembic alembic.ini scripts tests
          tar -czf frontend.tar.gz -C frontend/dist .
          tar -czf app-frontend.tar.gz -C app-frontend-dist .
          tar -czf ai-workspace.tar.gz -C services/ai-workspace README.md migrate_legacy_knowledge.py requirements.txt server.py test_server.py

      # An undefined secret renders as an empty string rather than failing, so
      # release 2026.08.07.20 died here in 0s with nothing but "exit code 1":
      # ssh-keyscan was handed an empty host and bailed before touching the
      # network. Check both secrets up front and say which one is missing.
      - name: Check deploy secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
        run: |
          missing=0
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::PRODUCTION_HOST is empty. Set it in Settings > Environments > production (host or IP only, no root@ and no port)."
            missing=1
          fi
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::PRODUCTION_SSH_KEY is empty. Set it in Settings > Environments > production (whole private key, including the BEGIN and END lines)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Both deploy secrets are present."

      - name: Upload and deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          # Passed as env rather than interpolated into the commands below: the
          # version is free text from workflow_dispatch, and `${{ }}` inside a
          # run block is substituted before the shell sees it, so a crafted
          # value would run as code on the production host.
          VERSION: ${{ inputs.version }}
        run: |
          STAGE_DIR="/tmp/ruoshop-release-$VERSION"
          install -m 700 -d ~/.ssh
          # Two ways a pasted key arrives unusable, both fixed here:
          #
          # 1. No trailing newline. printf '%s' omitted it and OpenSSH refuses
          #    to parse such a file -- release 2026.08.07.21 died on this with a
          #    bare exit 255. Adding one unconditionally is safe: a key ending in
          #    two newlines still parses, one ending in none never does.
          # 2. CRLF line endings. Copying out of a Windows editor gives every
          #    line a \r, which OpenSSH also rejects. Stripping CR is safe
          #    because the key body is base64 and never contains one.
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Keep the bytes as pasted: the shape report below has to describe what
          # arrived in the secret, not the rebuilt file.
          cp ~/.ssh/deploy_key ~/.ssh/deploy_key_as_pasted

          # ssh itself reports every failure as exit 255, so check the key parses
          # before using it, and try to rebuild it before giving up.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            # A paste can lose its line breaks entirely -- browser forms and
            # editors collapse them into spaces -- which leaves every base64
            # character intact but the PEM framing gone. That is repairable:
            # drop the markers, strip all whitespace from the body, re-wrap at
            # 70 columns and put the markers back. This cannot invent key
            # material, so a truncated paste still fails below.
            KEY_BODY="$(printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' \
              | sed -e 's/-----BEGIN[^-]*PRIVATE KEY-----//' \
                    -e 's/-----END[^-]*PRIVATE KEY-----//' \
              | tr -d ' \t\n')"
            {
              echo "-----BEGIN OPENSSH PRIVATE KEY-----"
              printf '%s\n' "$KEY_BODY" | fold -w 70
              echo "-----END OPENSSH PRIVATE KEY-----"
            } > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
          fi

          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::PRODUCTION_SSH_KEY is not a usable private key, and rebuilding its PEM framing did not help. Read the shape report below, then re-paste the whole file D:\\ServerKeys\\xiaoxu-ucloud-ed25519 -- not the .pub."
            # Shape only: counts and marker presence, never the key body.
            # A valid ed25519 key for this host is 7 lines and 399 bytes.
            echo "received: $(wc -l < ~/.ssh/deploy_key_as_pasted) lines, $(wc -c < ~/.ssh/deploy_key_as_pasted) bytes (expected 7 lines, ~399 bytes)"
            grep -q -- '-----BEGIN .*PRIVATE KEY-----' ~/.ssh/deploy_key_as_pasted \
              && echo "BEGIN marker: present" \
              || echo "BEGIN marker: MISSING -- the first line did not make it into the secret"
            grep -q -- '-----END .*PRIVATE KEY-----' ~/.ssh/deploy_key_as_pasted \
              && echo "END marker: present" \
              || echo "END marker: MISSING -- the paste was cut short"
            grep -q -- 'PUBLIC KEY' ~/.ssh/deploy_key_as_pasted \
              && echo "this is a PUBLIC key: you pasted xiaoxu-ucloud-ed25519.pub instead of xiaoxu-ucloud-ed25519" \
              || true
            exit 1
          fi
          rm -f ~/.ssh/deploy_key_as_pasted

          if ! ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "::error::ssh-keyscan got nothing from $DEPLOY_HOST. Check PRODUCTION_HOST and that the host allows inbound SSH from GitHub runners."
            exit 1
          fi
          # BatchMode makes ssh fail instead of waiting on a prompt no one can
          # answer in CI.
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o BatchMode=yes"
          # ubuntu, not root: deploy/README.md records the host as
          # ubuntu@152.32.174.85 and scripts/release.ps1 -- the deploy path that
          # already works -- defaults to DeployUser=ubuntu. deploy_remote.sh is
          # written for exactly that shape: an unprivileged login user that
          # escalates with sudo for all 37 of its writes.
          ssh $SSH_OPTS ubuntu@"$DEPLOY_HOST" "mkdir -p '$STAGE_DIR'"
          scp $SSH_OPTS backend.tar.gz frontend.tar.gz app-frontend.tar.gz ai-workspace.tar.gz ubuntu@"$DEPLOY_HOST":"$STAGE_DIR"/
          scp $SSH_OPTS scripts/deploy_remote.sh ubuntu@"$DEPLOY_HOST":"$STAGE_DIR"/
          ssh $SSH_OPTS ubuntu@"$DEPLOY_HOST" "bash '$STAGE_DIR/deploy_remote.sh' '$VERSION' '$STAGE_DIR' '$VERSION'"
