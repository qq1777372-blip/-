name: Build and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 2026.07.26.18
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            app-frontend/package-lock.json

      - name: Validate backend
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q main.py app schemas.py
          python -m unittest discover -s tests -v

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # The App ships from app-frontend into app-frontend-dist, which is
      # gitignored, so CI has to build it -- there is no committed artefact to
      # fall back on. `npm run build` runs vue-tsc first, so a type error fails
      # the release here rather than on the host.
      - name: Build app frontend
        working-directory: app-frontend
        run: |
          npm ci
          npm run build

      # deploy_remote.sh greps each dist for its own version, and /health/ready
      # reports the App as a separate check that must be ok. Neither build emits
      # version.json, so both are stamped here.
      - name: Stamp release
        run: |
          cat > frontend/dist/version.json <<EOF
          {"version":"${{ inputs.version }}","released_at":"$(date -Iseconds)","source":"${GITHUB_SHA}"}
          EOF
          cat > app-frontend-dist/version.json <<EOF
          {"version":"${{ inputs.version }}","released_at":"$(date -Iseconds)","source":"${GITHUB_SHA}"}
          EOF

      - name: Package release
        run: |
          tar -czf backend.tar.gz main.py schemas.py database.py models.py requirements.txt app alembic alembic.ini scripts tests
          tar -czf frontend.tar.gz -C frontend/dist .
          tar -czf app-frontend.tar.gz -C app-frontend-dist .

      # An undefined secret renders as an empty string rather than failing, so
      # release 2026.08.07.20 died here in 0s with nothing but "exit code 1":
      # ssh-keyscan was handed an empty host and bailed before touching the
      # network. Check both secrets up front and say which one is missing.
      - name: Check deploy secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
        run: |
          missing=0
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::PRODUCTION_HOST is empty. Set it in Settings > Environments > production (host or IP only, no root@ and no port)."
            missing=1
          fi
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::PRODUCTION_SSH_KEY is empty. Set it in Settings > Environments > production (whole private key, including the BEGIN and END lines)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Both deploy secrets are present."

      - name: Upload and deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          # Passed as env rather than interpolated into the commands below: the
          # version is free text from workflow_dispatch, and `${{ }}` inside a
          # run block is substituted before the shell sees it, so a crafted
          # value would run as code on the production host.
          VERSION: ${{ inputs.version }}
        run: |
          STAGE_DIR="/tmp/ruoshop-release-$VERSION"
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key root@"$DEPLOY_HOST" "mkdir -p '$STAGE_DIR'"
          scp -i ~/.ssh/deploy_key backend.tar.gz frontend.tar.gz app-frontend.tar.gz root@"$DEPLOY_HOST":"$STAGE_DIR"/
          scp -i ~/.ssh/deploy_key scripts/deploy_remote.sh root@"$DEPLOY_HOST":"$STAGE_DIR"/
          ssh -i ~/.ssh/deploy_key root@"$DEPLOY_HOST" "bash '$STAGE_DIR/deploy_remote.sh' '$VERSION' '$STAGE_DIR' '$VERSION'"
